<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern-App</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<meta name="theme-color" content="#f5f3ee">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#1f2430; --muted:#6b7180; --line:#e4e1d8;
    --accent:#2f6fed; --accent-soft:#e6eefe; --ok:#1e9e6a; --ok-soft:#e3f5ec;
    --bad:#d6453d; --bad-soft:#fbe7e5; --warn:#c98a12; --warn-soft:#fbf1dc;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
  #app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  h1{font-size:1.5rem;margin:.2em 0 .1em;font-weight:800}
  h2{font-size:1.2rem;margin:1.2em 0 .5em;font-weight:800}
  h3{font-size:1.02rem;margin:0 0 .3em;font-weight:800}
  p{margin:.4em 0}
  .muted{color:var(--muted)}
  .small{font-size:.88rem}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:40px}
  .topbar .grow{flex:1}
  .iconbtn{border:none;background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:1.1rem;cursor:pointer;color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .card.tap{cursor:pointer;transition:transform .08s}
  .card.tap:active{transform:scale(.99)}
  .row{display:flex;align-items:center;gap:12px}
  .row .grow{flex:1;min-width:0}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px 16px;font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer;background:var(--accent);color:#fff;margin:10px 0;text-align:center}
  .btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.ok{background:var(--ok)}
  .btn.bad{background:var(--bad)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.inline{display:inline-block;width:auto;padding:9px 14px;font-size:.92rem;margin:4px 0}
  .badge{display:inline-block;font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-new{background:var(--accent-soft);color:var(--accent)}
  .b-quiz{background:var(--accent-soft);color:var(--accent)}
  .b-learn{background:var(--warn-soft);color:var(--warn)}
  .b-done{background:var(--ok-soft);color:var(--ok)}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
  .progress > div{height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
  .context{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.92rem;margin-bottom:10px}
  .prompt{font-size:1.18rem;font-weight:700;margin:6px 0 14px}
  .opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin:9px 0;font:inherit;font-size:1rem;cursor:pointer;color:var(--ink)}
  .opt:active{border-color:var(--accent)}
  .opt.picked-ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.picked-bad{border-color:var(--bad);background:var(--bad-soft)}
  .tfrow{display:flex;gap:10px}
  .tfrow .opt{text-align:center;font-weight:800}
  input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:1.05rem;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .feedback{border-radius:14px;padding:14px;font-weight:800;margin:12px 0;font-size:1.05rem}
  .feedback.ok{background:var(--ok-soft);color:var(--ok)}
  .feedback.bad{background:var(--bad-soft);color:var(--bad)}
  .tip{font-size:.85rem;color:var(--muted);margin-top:4px}
  .speak{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink)}
  .ref-page{font-weight:800;color:var(--accent)}
  .wrongq{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:.92rem}
  .check{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;cursor:pointer}
  .check input{width:22px;height:22px}
  .steps{background:var(--warn-soft);border-radius:14px;padding:12px 14px}
  .steps ol{margin:.3em 0 0 1.1em;padding:0}
  .steps li{margin:.25em 0}
  .err{color:var(--bad);font-weight:700;font-size:.92rem;min-height:1.2em;margin-top:6px}
  .kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:7px 0;font-size:.92rem}
  .kv:last-child{border-bottom:none}
  .ans-line{font-size:.9rem;margin:3px 0}
  .ans-bad{color:var(--bad);font-weight:700}
  .ans-ok{color:var(--ok);font-weight:700}
  .seg{display:flex;gap:8px;margin:8px 0}
  .seg label{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:700;cursor:pointer;font-size:.92rem}
  .seg input{display:none}
  .seg input:checked + span{color:var(--accent)}
  .seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .big-emoji{font-size:3.2rem;text-align:center;margin:10px 0 0}
  .center{text-align:center}
  .statusbox summary::-webkit-details-marker,.chapter summary::-webkit-details-marker{display:none}
  .chapter[open] .chev{transform:rotate(180deg)}
  .statusbox[open] .chev{transform:rotate(180deg)}
  .chev{display:inline-block;transition:transform .15s}
  .player{margin-top:10px}
  .seek{width:100%;accent-color:var(--accent);height:28px}
  .pbtns{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:4px}
  .pbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:56px;height:56px;font:inherit;font-size:1.35rem;line-height:1;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pbtn small{font-size:.62rem;font-weight:800;margin-top:1px}
  .pbtn.play{width:68px;height:68px;background:var(--accent);color:#fff;border:none;font-size:1.5rem}
  .footer-note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:28px}
</style>
</head>
<body>
<div id="app"></div>

<script>

              { id:"a1", type:"tf", section:"Fachwissen", prompt:"Ein Gegenstand, der wärmer wird, gibt dabei Energie ab.", answer:false, explain:"Falsch. Was wärmer wird, nimmt Energie auf (das Wasser im Topf). Das brennende Holz gibt Energie ab.", refs:["s6"] },

const KEY = "lernapp.v1";
let memoryStore = null;
function loadStore(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return memoryStore || { pw:null, sets:{} };
}
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ memoryStore = S; }
}
let S = loadStore();
let storageOK = true;
try{ localStorage.setItem("lernapp.test","1"); localStorage.removeItem("lernapp.test"); }catch(e){ storageOK = false; }

/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtSub = s => esc(s).replace(/E_([A-Za-zäöü]+)/g, "E<sub>$1</sub>");
const norm = s => String(s||"").toLowerCase().trim()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
  .replace(/[^a-z0-9]/g,"");
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const nowStr = () => new Date().toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

function findSet(setId){
  for(const sub of SUBJECTS) for(const ch of sub.chapters) for(const st of ch.sets)
    if(st.id===setId) return { sub, ch, set:st };
  return null;
}
function qById(set, id){ return set.questions.find(q => q.id===id); }
function setState(setId){
  if(!S.sets[setId]) S.sets[setId] = { stage:"new", round:0, queue:[], idx:0, answers:{}, orders:{}, wrong:[], read:{}, history:[], approvals:[] };
  return S.sets[setId];
}

async function hashPw(pw){
  const salt = S.pw && S.pw.salt ? S.pw.salt : "";
  const data = new TextEncoder().encode(salt + "::" + pw);
  try{
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h = 5381; for(const b of data){ h = ((h<<5)+h + b) >>> 0; } return "f" + h.toString(16);
  }
}

/* ---------- Sprachausgabe ---------- */
let VOICES = [];
function loadVoices(){
  try{ VOICES = window.speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang)); }catch(e){ VOICES = []; }
}
try{ if("speechSynthesis" in window){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; } }catch(e){}
function voiceScore(v){
  const n = (v.name + " " + v.voiceURI).toLowerCase();
  let sc = 0;
  if(/premium|enhanced|erweitert|neural|natural|wavenet|online/.test(n)) sc += 10;
  if(/google/.test(n)) sc += 6;
  if(/anna|helena|petra|markus|yannick|viktor|katja|conrad|amala|seraphina|florian/.test(n)) sc += 3;
  if(v.lang === "de-DE" || v.lang === "de_DE") sc += 2;
  if(/compact|eloquence|grandma|grandpa|shelley|rocko|reed|sandy|flo |eddy|espeak/.test(n + " ")) sc -= 12;
  return sc;
}
function rankedVoices(){ return VOICES.slice().sort((a, b) => voiceScore(b) - voiceScore(a)); }
function pickVoice(){
  if(S.voice){ const v = VOICES.find(x => x.voiceURI === S.voice); if(v) return v; }
  return rankedVoices()[0] || null;
}
/* Text so umformen, dass er natürlich vorgelesen wird */
function speechText(t){
  const sub = { "₁":" eins", "₂":" zwei", "₃":" drei" };
  return String(t)
    .replace(/E_(H)\b/g, "E H").replace(/E_(B)\b/g, "E B").replace(/E_(S)\b/g, "E S")
    .replace(/E_el\b/g, "E elektrisch").replace(/E_ch\b/g, "E chemisch").replace(/E_therm\b/g, "E thermisch")
    .replace(/E_Strahl\b/g, "E Strahlung").replace(/E_Kern\b/g, "E Kern").replace(/E_([A-Za-zäöü]+)/g, "E $1")
    .replace(/([UI])([₁₂₃])/g, (m, a, b) => a + sub[b])
    .replace(/ΔE/g, "Delta E").replace(/Δt/g, "Delta t")
    .replace(/\s*→\s*/g, ", dann ").replace(/\s*=\s*/g, " gleich ").replace(/\s*·\s*/g, " mal ").replace(/\s*≈\s*/g, " ungefähr ")
    .replace(/(\d)\s*kWh\b/g, "$1 Kilowattstunden").replace(/(\d)\s*Wh\b/g, "$1 Wattstunden")
    .replace(/(\d)\s*kJ\b/g, "$1 Kilojoule").replace(/(\d)\s*MJ\b/g, "$1 Megajoule").replace(/(\d)\s*J\b/g, "$1 Joule")
    .replace(/(\d)\s*kW\b/g, "$1 Kilowatt").replace(/(\d)\s*W\b/g, "$1 Watt")
    .replace(/(\d)\s*mA\b/g, "$1 Milliampere").replace(/(\d)\s*A\b/g, "$1 Ampere")
    .replace(/(\d)\s*kV\b/g, "$1 Kilovolt").replace(/(\d)\s*V\b/g, "$1 Volt")
    .replace(/(\d)\s*km\/h\b/g, "$1 Kilometer pro Stunde").replace(/(\d)\s*°C\b/g, "$1 Grad Celsius")
    .replace(/(\d)\s*kg\b/g, "$1 Kilogramm").replace(/(\d)\s*g\b/g, "$1 Gramm").replace(/(\d)\s*mm\/s\b/g, "$1 Millimeter pro Sekunde")
    .replace(/(\d)\s*m\b/g, "$1 Meter").replace(/(\d)\s*s\b/g, "$1 Sekunden").replace(/(\d)\s*h\b/g, "$1 Stunden")
    .replace(/\bz\. ?B\./g, "zum Beispiel").replace(/\bS\. (\d)/g, "Seite $1").replace(/\bca\./g, "circa")
    .replace(/\b1 (Kilowattstunde|Wattstunde)n\b/g, "eine $1").replace(/…/g, " … ").replace(/[„“"]/g, "").replace(/\s+/g, " ").trim();
}
function speakQueue(parts){
  try{
    if(!("speechSynthesis" in window)) return;
    const syn = window.speechSynthesis;
    syn.cancel();
    if(!VOICES.length) loadVoices();
    const v = pickVoice();
    const chunks = [];
    parts.forEach(p => String(p).split(/(?<=[.!?…:])\s+/).forEach(c => { if(c.trim()) chunks.push(c.trim()); }));
    chunks.forEach(c => {
      const u = new SpeechSynthesisUtterance(c);
      u.lang = (v && v.lang) || "de-DE";
      if(v) u.voice = v;
      u.rate = S.rate || 0.95;
      u.pitch = 1;
      syn.speak(u);
    });
  }catch(e){}
}
function speak(text){ speakQueue([speechText(text)]); }

function answerText(q, given){
  if(given===undefined || given===null || given==="") return "(keine Antwort)";
  if(q.type==="tf"){ const L = q.labels || ["wahr","falsch"]; return given ? L[0] : L[1]; }
  if(q.type==="mc") return q.options[given];
  return given;
}
function correctText(q){
  if(q.type==="tf"){ const L = q.labels || ["wahr","falsch"]; return q.answer ? L[0] : L[1]; }
  if(q.type==="mc") return q.options[q.answer];
  return q.answer[0].charAt(0).toUpperCase() + q.answer[0].slice(1);
}
function isCorrect(q, given){
  if(q.type==="tf") return given === q.answer;
  if(q.type==="mc") return given === q.answer;
  return q.answer.map(norm).includes(norm(given));
}


/* ---------- Audio (Podcasts zum Kapitel) ---------- */
const fmtTime = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); };
const mainAudio = ch => (ch.audios||[]).find(a => a.main) || (ch.audios||[])[0];
function tocList(au, k){
  if(!au.toc) return "";
  return `<div style="margin-top:12px"><b class="small">Inhalt – tippe zum Springen</b>` + au.toc.map((s,i) => `
    <div class="wrongq">
      <div class="row"><div class="grow"><b>${i+1}. ${esc(s.title)}</b></div>
      ${s.t!==null && s.t!==undefined ? `<button class="speak" data-seek="${s.t}" data-aud="${k}">▶ ${fmtTime(s.t)}</button>` : `<span class="small muted">–</span>`}</div>
      <div class="small muted" style="margin-top:3px">${s.points.map(esc).join(" · ")}</div>
      ${s.note ? `<div class="small" style="margin-top:4px;color:var(--warn);font-weight:700">⚠️ ${fmtSub(s.note)}</div>` : ""}
    </div>`).join("") + `</div>`;
}
function playerHtml(au, k, open){
  return `<audio id="aud-${k}" preload="metadata" src="${esc(au.src)}"></audio>
    <div class="player">
      <input type="range" class="seek" id="seek-${k}" min="0" max="${au.seconds||1680}" step="1" value="0" aria-label="Position">
      <div class="row small muted" style="margin-top:2px"><span id="cur-${k}">0:00</span><span class="grow"></span><span id="dur-${k}">${au.seconds?fmtTime(au.seconds):"–:–"}</span></div>
      <div class="pbtns">
        <button class="pbtn" data-skip="-15" data-aud="${k}" aria-label="15 Sekunden zurück">↺<small>15</small></button>
        <button class="pbtn play" id="play-${k}" data-aud="${k}" aria-label="Abspielen">▶</button>
        <button class="pbtn" data-skip="15" data-aud="${k}" aria-label="15 Sekunden vor">↻<small>15</small></button>
      </div>
    </div>
    <div class="small muted" id="audpos-${k}"></div>
    ${au.note ? `<div class="small" style="margin-top:6px;background:var(--warn-soft);border-radius:10px;padding:8px 10px">⚠️ ${esc(au.note)}</div>` : ""}
    <details ${open?"open":""} style="margin-top:6px"><summary class="small" style="cursor:pointer;font-weight:700;color:var(--accent)">Inhaltsübersicht</summary>${tocList(au, k)}</details>`;
}
function audioBlock(ch){
  if(!ch.audios || !ch.audios.length) return "";
  const main = mainAudio(ch);
  let html = `<div class="card"><div class="row"><div style="font-size:1.6rem">🎧</div><div class="grow"><b>Podcast: Kapitel anhören</b><div class="small muted">${esc(main.title)} · ${esc(main.length||"")}</div></div></div>
    ${playerHtml(main, ch.audios.indexOf(main))}`;
  ch.audios.forEach((au, k) => {
    if(au === main) return;
    html += `<details style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px"><summary class="small" style="cursor:pointer;font-weight:700">🎧 ${esc(au.title)} · ${esc(au.length||"")}</summary>${playerHtml(au, k)}</details>`;
  });
  return html + `</div>`;
}
function bindAudio(ch){
  if(!ch.audios) return;
  const players = [];
  ch.audios.forEach((au, k) => {
    const a = document.getElementById("aud-" + k); if(!a) return;
    players[k] = a;
    const key = "audiopos:" + au.src;
    let saved = 0; try{ saved = parseFloat(localStorage.getItem(key)||"0")||0; }catch(e){}
    const pos = document.getElementById("audpos-" + k);
    if(saved > 5 && pos) pos.textContent = "Weiter bei " + fmtTime(saved);
    a.addEventListener("loadedmetadata", () => { if(saved > 5 && saved < a.duration - 5 && a.currentTime < 1) a.currentTime = saved; }, { once:true });
    let last = 0;
    a.addEventListener("timeupdate", () => { if(Math.abs(a.currentTime - last) > 4){ last = a.currentTime; try{ localStorage.setItem(key, String(a.currentTime)); }catch(e){} } });
    a.addEventListener("play", () => players.forEach(p => { if(p && p !== a) p.pause(); }));
    const seek = document.getElementById("seek-" + k), cur = document.getElementById("cur-" + k), dur = document.getElementById("dur-" + k), pb = document.getElementById("play-" + k);
    let dragging = false;
    const sync = () => { if(!dragging && seek) seek.value = Math.floor(a.currentTime); if(cur) cur.textContent = fmtTime(a.currentTime); };
    a.addEventListener("loadedmetadata", () => { if(seek && isFinite(a.duration)){ seek.max = Math.floor(a.duration); } if(dur && isFinite(a.duration)) dur.textContent = fmtTime(a.duration); sync(); });
    a.addEventListener("timeupdate", sync);
    a.addEventListener("play", () => { if(pb){ pb.textContent = "❚❚"; pb.setAttribute("aria-label","Pause"); } });
    a.addEventListener("pause", () => { if(pb){ pb.textContent = "▶"; pb.setAttribute("aria-label","Abspielen"); } });
    if(pb) pb.onclick = () => { if(a.paused) a.play().catch(()=>{}); else a.pause(); };
    if(seek){
      seek.addEventListener("input", () => { dragging = true; if(cur) cur.textContent = fmtTime(seek.value); });
      seek.addEventListener("change", () => { a.currentTime = parseFloat(seek.value); dragging = false; });
    }
    document.querySelectorAll(`[data-skip][data-aud="${k}"]`).forEach(b => b.onclick = () => {
      const d = parseFloat(b.dataset.skip);
      const go = () => { a.currentTime = Math.max(0, Math.min((isFinite(a.duration)?a.duration:1e9) - 0.5, a.currentTime + d)); sync(); };
      if(a.readyState >= 1) go(); else { a.addEventListener("loadedmetadata", go, { once:true }); a.load(); }
    });
  });
  document.querySelectorAll("[data-seek]").forEach(b => b.onclick = () => {
    const k = parseInt(b.dataset.aud || "0", 10);
    const a = players[k]; if(!a) return;
    const t = parseFloat(b.dataset.seek);
    const det = a.closest("details"); if(det && !det.open && det.querySelector("audio") === a) det.open = true;
    const play = () => { a.currentTime = t; a.play().catch(()=>{}); };
    if(a.readyState >= 1) play(); else { a.addEventListener("loadedmetadata", play, { once:true }); a.load(); }
    a.scrollIntoView({ behavior:"smooth", block:"center" });
  });
}

let view = { name:"home" };
function go(v){ view = v; try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} render(); window.scrollTo(0,0); }
function render(){
  if(!S.pw) return renderSetup();
  switch(view.name){
    case "home": return renderHome();
    case "set": return renderSet(view.setId);
    case "quiz": return renderQuiz(view.setId);
    case "learn": return renderLearn(view.setId);

    case "review": return renderReview(view.setId);

}

    html += `<button class="btn" id="start">Runde 1 starten</button>`;
  } else if(st.stage==="quiz"){
    html += `<button class="btn" id="cont">Weiter mit Runde ${st.round} (Frage ${st.idx+1} von ${st.queue.length})</button>`;
  } else if(st.stage==="learn"){
    html += `<button class="btn" id="learn">Zur Leseliste (${st.wrong.length} Fehler)</button>`;
  } else if(st.stage==="done"){
    html += `<div class="card center"><div class="big-emoji">🏆</div><h3>Alles richtig!</h3><p class="muted">Dieses Set sitzt. Zur Wiederholung kurz vor der Arbeit einfach neu starten.</p></div>`;
  }
  if(st.stage!=="new"){
    html += `<button class="btn secondary" id="restart">Komplett neu starten (Eltern)</button>`;
  }
  $app.innerHTML = html;
  bindTopbar({name:"home"});
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on("start", () => { startRound(setId, f.set.questions.map(q=>q.id)); go({name:"quiz", setId}); });
  on("cont", () => go({name:"quiz", setId}));
  on("learn", () => go({name:"learn", setId}));
  on("restart", () => go({ name:"gate", title:"Neu starten", next:{name:"restart", setId}, back:{name:"set", setId} }));
}

function startRound(setId, ids){
  const f = findSet(setId); const st = setState(setId);
  st.round = (st.round||0) + 1;
  st.queue = shuffle(ids);
  st.idx = 0; st.answers = {}; st.orders = {}; st.stage = "quiz"; st.read = {};
  for(const id of st.queue){ const q = qById(f.set, id); if(q && q.type==="mc") st.orders[id] = shuffle(q.options.map((_,i)=>i)); }
  saveStore();
}

/* ---------- Quiz ---------- */
function renderQuiz(setId){
  const f = findSet(setId); const st = setState(setId);
  if(st.stage!=="quiz") return go({name:"set", setId});
  if(st.idx >= st.queue.length) return finishRound(setId);
  const q = qById(f.set, st.queue[st.idx]);
  const answered = st.answers[q.id];
  const pct = Math.round(st.idx / st.queue.length * 100);

  let html = topbar(`Runde ${st.round}`, true);
  html += `<div class="row small muted"><div class="grow">Frage ${st.idx+1} von ${st.queue.length}${q.section ? " · "+esc(q.section) : ""}</div>
           <button class="speak" id="say">🔊 Vorlesen</button></div>`;
  html += `<div class="progress"><div style="width:${pct}%"></div></div>`;
  html += `<div class="card">`;
  if(q.context) html += `<div class="context">${fmtSub(q.context)}</div>`;
  html += `<div class="prompt">${fmtSub(q.prompt)}</div>`;

  if(q.type==="tf"){
    const L = q.labels || ["wahr","falsch"];
    const cls = v => answered ? (answered.given===v ? (answered.correct?"picked-ok":"picked-bad") : "") : "";
    html += `<div class="tfrow">
      <button class="opt ${cls(true)}" data-v="true" ${answered?"disabled":""}>${esc(L[0])}</button>
      <button class="opt ${cls(false)}" data-v="false" ${answered?"disabled":""}>${esc(L[1])}</button></div>`;
    if(!answered) html += `<div class="tip">Tipp: Sag zuerst laut, ob es stimmt – und warum.</div>`;
  } else if(q.type==="mc"){
    const order = st.orders[q.id] || q.options.map((_,i)=>i);
    for(const i of order){
      const cls = answered ? (answered.given===i ? (answered.correct?"picked-ok":"picked-bad") : "") : "";
      html += `<button class="opt ${cls}" data-i="${i}" ${answered?"disabled":""}>${fmtSub(q.options[i])}</button>`;
    }
    if(!answered) html += `<div class="tip">Tipp: Überleg dir die Antwort erst, bevor du die Möglichkeiten liest.</div>`;
  } else {
    html += `<input type="text" id="txt" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eintippen" ${answered?"disabled":""} value="${answered?esc(answered.given):""}">`;
    if(!answered) html += `<button class="btn" id="submit">Antwort prüfen</button>`;
  }
  html += `</div>`;

  if(answered){
    html += answered.correct
      ? `<div class="feedback ok">✓ Richtig!</div>`
      : `<div class="feedback bad">✗ Leider falsch.
           <div style="font-weight:600;font-size:.92rem;margin-top:8px;color:var(--ink)">📖 Nachlesen in ${esc(f.ch.title)}:</div>
           ${q.refs.map(r => { const ref = f.ch.refs[r]; return `<div style="font-weight:600;font-size:.92rem;color:var(--ink);margin-top:4px"><span class="ref-page">${esc(ref.page)}</span> · ${esc(ref.where)}</div>`; }).join("")}
           <div class="small muted" style="font-weight:600;margin-top:8px">Am Ende der Runde steht das auch in deiner Leseliste.</div>
         </div>`;
    html += `<button class="btn" id="next">${st.idx+1 < st.queue.length ? "Nächste Frage" : "Auswertung"}</button>`;
  }
  html += `<p class="footer-note">Du kannst jederzeit aufhören – es geht hier weiter.</p>`;
  $app.innerHTML = html;
  bindTopbar({name:"set", setId});

  document.getElementById("say").onclick = () => {
    const parts = [];
    if(q.context) parts.push(speechText(q.context));
    let p = speechText(q.prompt); if(!/[.!?…:]$/.test(p)) p += ".";
    parts.push(p);
    if(q.type==="mc"){
      const nums = ["Erstens", "Zweitens", "Drittens", "Viertens", "Fünftens"];
      (st.orders[q.id]||q.options.map((_,i)=>i)).forEach((i, k) => parts.push(nums[k] + ": " + speechText(q.options[i]) + "."));
    } else if(q.type==="tf"){
      const L = q.labels || ["wahr","falsch"];
      parts.push(L[0] + " oder " + L[1] + "?");
    }
    speakQueue(parts);
  };
  const record = given => {
    st.answers[q.id] = { given, correct: isCorrect(q, given) };
    saveStore(); render();
  };
  if(!answered){
    $app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => record(b.dataset.v==="true"));
    $app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => record(parseInt(b.dataset.i,10)));
    const sub = document.getElementById("submit");
    if(sub){
      const txt = document.getElementById("txt");
      const doIt = () => { if(!txt.value.trim()) { txt.focus(); return; } record(txt.value.trim()); };
      sub.onclick = doIt;
      txt.addEventListener("keydown", e => { if(e.key==="Enter") doIt(); });
    }
  } else {
    document.getElementById("next").onclick = () => { st.idx++; saveStore(); render(); window.scrollTo(0,0); };
  }
}

function finishRound(setId){
  const f = findSet(setId); const st = setState(setId);
  const roundWrong = st.queue.filter(id => !(st.answers[id] && st.answers[id].correct));
  const correct = st.queue.length - roundWrong.length;
  st.history.push({ round: st.round, date: nowStr(), correct, total: st.queue.length });
  const pending = (st.pending||[]).filter(id => !roundWrong.includes(id));
  const wrong = roundWrong.concat(pending);
  st.wrong = wrong;
  st.lastAnswers = Object.assign({}, st.pendingAnswers||{}, st.answers);
  st.pending = []; st.pendingAnswers = {};
  st.stage = wrong.length ? "learn" : "done";
  saveStore();
  go({ name: wrong.length ? "learn" : "set", setId });
}

/* ---------- Leseliste ---------- */
function buildReadingList(f, st){
  const map = {};
  for(const id of st.wrong){
    const q = qById(f.set, id); if(!q) continue;
    for(const r of q.refs){
      if(!map[r]) map[r] = { ref: f.ch.refs[r], id: r, qs: [] };
      map[r].qs.push(q);
    }
  }
  return Object.values(map).sort((a,b) => a.ref.p - b.ref.p);
}

function renderLearn(setId){
  const f = findSet(setId); const st = setState(setId);
  if(st.stage!=="learn") return go({name:"set", setId});
  const last = st.history[st.history.length-1];
  const list = buildReadingList(f, st);
  const allRead = list.every(item => st.read[item.id]);

  let html = topbar("Deine Leseliste", true);
  html += `<div class="card"><div class="row"><div class="grow"><b>Runde ${last.round}</b><div class="small muted">${last.correct} von ${last.total} richtig</div></div><span class="badge b-learn">${st.wrong.length} offen</span></div></div>`;
  html += `<div class="steps"><b>So lernst du:</b><ol>
    <li>Lies die Stelle im Buch.</li>
    <li>Buch zu.</li>
    <li>Hake ab, wenn du es erklären kannst.</li>
  </ol></div>`;
  html += `<h2>${list.length} ${list.length===1?"Stelle":"Stellen"} im Buch</h2>`;
  for(const item of list){
    html += `<div class="card">
      <div><span class="ref-page">${esc(item.ref.page)}</span> · <b>${esc(item.ref.topic)}</b></div>
      <div class="small muted" style="margin-top:3px">${esc(item.ref.where)}</div>
      ${(() => { const au = mainAudio(f.ch); if(!au || item.ref.toc===undefined || !au.toc[item.ref.toc]) return ""; const k = f.ch.audios.indexOf(au); const s = au.toc[item.ref.toc]; return `<button class="speak" data-jump="${s.t}" style="margin-top:8px">🎧 Anhören: „${esc(s.title)}“ ab ${fmtTime(s.t)}</button>`; })()}`;
    for(const q of item.qs){
      const a = (st.lastAnswers||{})[q.id];
      html += `<div class="wrongq">${q.context?`<span class="muted">${fmtSub(q.context)}</span><br>`:""}${fmtSub(q.prompt)}<div class="ans-line">Deine Antwort: <span class="ans-bad">${esc(answerText(q, a && a.given))}</span></div></div>`;
    }
    html += `<label class="check"><input type="checkbox" data-read="${item.id}" ${st.read[item.id]?"checked":""}> Gelesen – ich kann's erklären</label></div>`;
  }
  html += `<div class="steps" style="margin-top:16px"><b>Dann zu deinen Eltern – erkläre für jede Frage:</b><ol>
    <li>Was habe ich geantwortet?</li>
    <li>Warum war das falsch?</li>
    <li>Was ist richtig – und warum?</li>
  </ol></div>`;
  html += `<button class="btn" id="gate" ${allRead?"":"disabled"}>Eltern: Freigabe</button>`;
  html += `<p class="small muted center" id="readhint" style="${allRead?"display:none":""}">Hake erst alle Stellen ab.</p>`;
  $app.innerHTML = html;
  bindTopbar({name:"set", setId});
  $app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => go({ name:"materials", chId: f.ch.id, seek: parseFloat(b.dataset.jump), back:{name:"learn", setId} }));
  $app.querySelectorAll("[data-read]").forEach(cb => cb.onchange = () => {
    st.read[cb.dataset.read] = cb.checked; saveStore();
    const ok = list.every(item => st.read[item.id]);
    const g = document.getElementById("gate"); if(g) g.disabled = !ok;
    const hint = document.getElementById("readhint"); if(hint) hint.style.display = ok ? "none" : "";
  });
  const g = document.getElementById("gate");
  if(g) g.onclick = () => go({ name:"gate", title:"Freigabe", next:{name:"review", setId}, back:{name:"learn", setId} });
}

/* ---------- Passwort-Abfrage ---------- */
function renderGate(){
  const v = view;
  $app.innerHTML = topbar(v.title || "Passwort", true) + `
    <div class="big-emoji">🔒</div>
    <p class="center muted">Nur für Eltern.</p>
    <div class="card">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort">
      <div class="err" id="err"></div>
      <button class="btn" id="ok">Weiter</button>
    </div>`;
  bindTopbar(v.back || {name:"home"});
  const pw = document.getElementById("pw");
  const check = async () => {
    const h = await hashPw(pw.value);
    if(h !== S.pw.hash){ document.getElementById("err").textContent = "Falsches Passwort."; pw.value=""; pw.focus(); return; }
    const n = v.next;
    if(n.name==="restart"){
      const st = setState(n.setId);
      Object.assign(st, { stage:"new", round:0, queue:[], idx:0, answers:{}, orders:{}, wrong:[], read:{}, pending:[], pendingAnswers:{} });
      saveStore(); return go({name:"set", setId:n.setId});
    }
    go(Object.assign({}, n, { authed:true }));
  };
  document.getElementById("ok").onclick = check;
  pw.addEventListener("keydown", e => { if(e.key==="Enter") check(); });
  setTimeout(()=>pw.focus(), 50);
}

/* ---------- Freigabe (Eltern) – einzeln je Frage ---------- */
function renderReview(setId){
  if(!view.authed) return go({name:"learn", setId});
  const f = findSet(setId); const st = setState(setId);
  if(!view.dec) view.dec = {};
  const dec = view.dec;
  const n = st.wrong.length;
  const decided = st.wrong.filter(id => dec[id]!==undefined).length;
  const nPass = st.wrong.filter(id => dec[id]===true).length;
  const nFail = st.wrong.filter(id => dec[id]===false).length;

  let html = topbar("Freigabe", true);
  html += `<p class="muted">Lass dir jede Frage erklären und entscheide einzeln. Freigegebene Fragen kommen in die nächste Runde, nicht bestandene bleiben auf seiner Leseliste.</p>`;
  html += `<div class="row small" style="margin:6px 0 2px"><div class="grow muted">${decided} von ${n} entschieden</div>
           <button class="speak" id="allok">Alle bestanden</button></div>`;
  st.wrong.forEach((id, k) => {
    const q = qById(f.set, id); const a = (st.lastAnswers||{})[id];
    const d = dec[id];
    const border = d===true ? "var(--ok)" : d===false ? "var(--bad)" : "var(--line)";
    html += `<div class="card" style="border:2px solid ${border}">
      <div class="small muted">Frage ${k+1} von ${n}</div>
      ${q.context?`<div class="small muted" style="margin-top:4px">${fmtSub(q.context)}</div>`:""}
      <div style="font-weight:700;margin:4px 0">${fmtSub(q.prompt)}</div>
      <div class="ans-line">Gegebene Antwort: <span class="ans-bad">${esc(answerText(q, a && a.given))}</span></div>
      <div class="ans-line">Richtig: <span class="ans-ok">${fmtSub(correctText(q))}</span></div>
      <div class="small" style="margin-top:6px">${fmtSub(q.explain)}</div>
      <div class="small muted" style="margin-top:4px">${q.refs.map(r=>esc(f.ch.refs[r].page)).join(", ")}</div>
      <div class="tfrow" style="margin-top:8px">
        <button class="opt ${d===true?"picked-ok":""}" data-dec="${id}" data-ok="1" style="padding:11px">✓ Bestanden</button>
        <button class="opt ${d===false?"picked-bad":""}" data-dec="${id}" data-ok="0" style="padding:11px">✗ Nochmal lernen</button>
      </div>
    </div>`;
  });
  const others = f.set.questions.length - nFail;
  html += `<div class="card"><h3>Ergebnis</h3>
    <div class="kv"><span>Bestanden → kommen in Runde ${st.round+1}</span><b style="color:var(--ok)">${nPass}</b></div>
    <div class="kv"><span>Nicht bestanden → bleiben auf der Leseliste</span><b style="color:var(--bad)">${nFail}</b></div>`;
  if(nPass>0){
    html += `<p class="small muted" style="margin-top:10px">Nächste Runde:</p>
    <div class="seg">
      <label><input type="radio" name="mode" value="wrong" ${view.mode!=="all"?"checked":""}><span>Nur die ${nPass} freigegebenen</span></label>
      <label><input type="radio" name="mode" value="all" ${view.mode==="all"?"checked":""}><span>Alle ${others} Fragen</span></label>
    </div>`;
  }
  html += `<textarea id="note" rows="2" placeholder="Notiz (optional)">${esc(view.note||"")}</textarea>
    <button class="btn" id="save" ${decided<n?"disabled":""}>Freigabe speichern</button>
    ${decided<n?`<p class="small muted center">Bitte zu jeder Frage entscheiden.</p>`:""}
  </div>`;
  if(st.approvals.length){
    html += `<div class="card"><h3>Bisherige Freigaben</h3>` + st.approvals.slice().reverse().map(a => {
      const res = (a.passed!==undefined) ? `<b><span style="color:var(--ok)">${a.passed} ✓</span> · <span style="color:var(--bad)">${a.failed} ✗</span></b>`
        : `<b style="color:${a.ok?"var(--ok)":"var(--bad)"}">${a.ok?"bestanden":"nicht bestanden"}</b>`;
      return `<div class="kv"><span>${esc(a.date)} · nach Runde ${a.round}${a.note?` · ${esc(a.note)}`:""}</span>${res}</div>`;
    }).join("") + `</div>`;
  }
  const y = window.scrollY;
  $app.innerHTML = html;
  window.scrollTo(0, y);
  bindTopbar({name:"learn", setId});
  const keep = () => { const m = $app.querySelector('input[name="mode"]:checked'); if(m) view.mode = m.value; view.note = document.getElementById("note").value; };
  $app.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { keep(); dec[b.dataset.dec] = b.dataset.ok==="1"; renderReview(setId); });
  document.getElementById("allok").onclick = () => { keep(); st.wrong.forEach(id => dec[id]=true); renderReview(setId); };
  $app.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = keep);
  document.getElementById("save").onclick = () => {
    keep();
    const passed = st.wrong.filter(id => dec[id]===true);
    const failed = st.wrong.filter(id => dec[id]===false);
    st.approvals.push({ date: nowStr(), round: st.round, passed: passed.length, failed: failed.length, note: (view.note||"").trim() });
    if(passed.length===0){
      st.read = {};
      saveStore();
      return go({name:"learn", setId});
    }
    // Nicht bestandene merken: sie kommen nach der nächsten Runde wieder auf die Leseliste
    const keepAns = {};
    for(const id of failed) keepAns[id] = (st.lastAnswers||{})[id];
    st.pending = failed;
    st.pendingAnswers = keepAns;
    const ids = view.mode==="all" ? f.set.questions.map(q=>q.id).filter(id => !failed.includes(id)) : passed;
    startRound(setId, ids);
    go({name:"quiz", setId});
  };
}

    try{ data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(9))))); }catch(e){ bkmsg.style.color = ""; bkmsg.textContent = "Der Code ist beschädigt oder unvollständig."; return; }
    if(!data || typeof data !== "object" || !data.sets){ bkmsg.style.color = ""; bkmsg.textContent = "Der Code enthält keinen Lernstand."; return; }
    if(!bkConfirm){ bkConfirm = true; bkmsg.style.color = "var(--warn)"; bkmsg.textContent = "Achtung: Der jetzige Stand wird ersetzt. Zum Bestätigen nochmal auf „Wiederherstellen“ tippen."; return; }
    S = data; saveStore();
    bkmsg.style.color = "var(--ok)"; bkmsg.textContent = "Wiederhergestellt.";
    setTimeout(() => go({name:"home"}), 900);
  };
  document.getElementById("chg").onclick = async () => {
    const a = document.getElementById("n1").value, b = document.getElementById("n2").value, err = document.getElementById("err");
    if(a.length<4){ err.textContent="Mindestens 4 Zeichen."; return; }
    if(a!==b){ err.textContent="Stimmt nicht überein."; return; }
    S.pw.salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    S.pw.hash = await hashPw(a); saveStore();
    err.style.color = "var(--ok)"; err.textContent = "Gespeichert.";
  };
}

render();
</script>
</body>
</html>
